services:
  # FastAPI Backend Web Service
  - type: web
    name: intelliops-copilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"

  # React Frontend Node.js Web Service
  - type: web
    name: intelliops-copilot-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: VITE_API_URL
        value: https://intelliops-copilot-backend.onrender.com
