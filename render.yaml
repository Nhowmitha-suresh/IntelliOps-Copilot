services:
  # FastAPI Backend Web Service
  - type: web
    name: intelliops-copilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"

  # React Frontend Static Site (Render Blueprint spec: type 'web' with runtime 'static')
  - type: web
    name: intelliops-copilot-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/.output/public
    envVars:
      - key: VITE_API_URL
        value: https://intelliops-copilot-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
