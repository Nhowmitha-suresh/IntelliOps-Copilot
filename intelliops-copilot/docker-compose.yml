services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intelliops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: intelliops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: intelliops_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliops_app
    restart: always
    environment:
      POSTGRES_DSN: postgresql://postgres:postgrespassword@postgres:5432/intelliops
      MONGO_URI: mongodb://root:mongopassword@mongo:27017/intelliops?authSource=admin
      LLM_PRIMARY_PROVIDER: openai
      LLM_FALLBACK_PROVIDER: google
      MAX_RETRIES: 3
      REQUEST_TIMEOUT_SECONDS: 30
      SIMILARITY_THRESHOLD: 0.7
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongo

volumes:
  postgres_data:
  mongo_data:
